<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  <!-- jQuery 라이브러리 추가 -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Chart.js 라이브러리 추가 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    a:visited {
      color: inherit;
    }
    .row {
        display: flex;
        flex-wrap: wrap;
        margin-right: -15px;
        margin-left: -15px;
    }
    .col-md-4 {
        position: relative;
        width: 100%;
        min-height: 1px;
        padding-right: 15px;
        padding-left: 15px;
        flex: 0 0 33.333333%;
        max-width: 33.333333%;
    }
    .modal-backdrop {
      z-index: -1;
    }
    .btn-lg{
      border: none;
      background-color: white;
    }
    .btn-img {
      height: 100px; /* 이미지 세로 크기 조절 */
      width: auto; /* 이미지 가로 크기 자동 조절 */
    }
    .btn-font{
      font-size: 16px;
    }
    .modal-dialog{
      max-width: 800px;
    }
  </style>
  <script>
    $(document).ready(function() {
      
      /*
      const cctvData={{cctv}}
      const lampData={{lamp}}
      const crimeData={{criminal}}
      */

      // 범죄율, 가로등, cctv 차트
      const cctvData = JSON.parse('{{ cctv }}');
      const lampData = JSON.parse('{{ lamp }}');
      const crimeData = JSON.parse('{{ criminal }}');
      
      // 어린이 보호구역 교통사고 발생 비율
    
      // 지역구 연도별 평균 매매가
      const hpriceData = JSON.parse('{{ hprice }}');

      const myModal1 = document.getElementById('modal1');
      const myModal2 = document.getElementById('modal2');
      const myModal3 = document.getElementById('modal3');

      myModal1.addEventListener('shown.bs.modal', function() {
        initializeCharts1();
      });

      myModal2.addEventListener('shown.bs.modal', function() {
        initializeCharts2();
      });

      myModal3.addEventListener('shown.bs.modal', function() {
        initializeCharts3();
      });

      // 라인 차트
      function initializeCharts1() {
        const labels1 = ['2018', '2019', '2020', '2021'];
        const data1 = {
          labels: labels1,
          datasets: [{
            label: 'cctv',
            data: cctvData,
            yAxisID: 'left-y-axis',
            fill: false,
            borderColor: 'rgb(75, 192, 192)',
            tension: 0.1
          },{
            label: '가로등',
            data: lampData,
            yAxisID: 'right-y-axis',
            fill: false,
            borderColor: 'rgb(255, 99, 132)',
            tension: 0.1
      
          },{
            label: '범죄발생',
            data: crimeData,
            yAxisID: 'left-y-axis',
            fill: false,
            borderColor: 'rgb(153, 102, 255)',
            tension: 0.1
      
          }]
        };
        const config1 = {
          type: 'line',
          data: data1,
          options: {
            scales: {
              'left-y-axis': {
                position: 'left',
                beginAtZero: false,
                title: {
                  display: true,
                  text: 'cctv 및 범죄발생', // 왼쪽 y축 레이블
                },
                grid: {
                  display: true,
                }
              },
              'right-y-axis': {
                position: 'right',
                beginAtZero: false,
                title: {
                  display: true,
                  text: '가로등', // 오른쪽 y축 레이블
                },
                grid: {
                  display: false,
                }
              }
            }
          }
        };

        const ctx1 = document.getElementById('chart1').getContext('2d');
        new Chart(ctx1, config1);
      }

      // 해당 지역구 어린이 보호구역 사고 비율
      function initializeCharts2() {
        const labels2 = '구이름';
        const data2 = {
          labels: labels2,
          datasets: [{
            label: '어린이 보호구역 교통사고 비율',
            data: /* 비율 */'',
            backgroundColor: [
              'rgb(255, 99, 132)',
              'rgb(54, 162, 235)',
              'rgb(255, 205, 86)'
            ],
            hoverOffset: 4
          }]
        };
        const config2 = {
          type: 'doughnut',
          data: data2,
        };

        const ctx2 = document.getElementById('chart2').getContext('2d');
        new Chart(ctx2, config2);
      }

      // 해당 지역구 연도별 평균 매매가
      function initializeCharts3() {
        const labels3 = ['2018', '2019', '2020', '2021', '2022'];
        const data3 = {
          labels: labels3,
          datasets: [{
            label: '해당 지역구 연도별 평균 매매가',
            data: hpriceData,
            backgroundColor: [
              'rgba(255, 99, 132, 0.2)',
              'rgba(255, 205, 86, 0.2)',
              'rgba(75, 192, 192, 0.2)',
              'rgba(153, 102, 255, 0.2)',
              'rgba(201, 203, 207, 0.2)'
            ],
            borderColor: [
              'rgb(255, 99, 132)',
              'rgb(255, 205, 86)',
              'rgb(75, 192, 192)',
              'rgb(153, 102, 255)',
              'rgb(201, 203, 207)'
            ],
            borderWidth: 1
          }]
        };
        const config3 = {
          type: 'bar',
          data: data3,
          options: {
            plugins: {
              legend: {
                display: false
              }
            },
            scales: {
              y: {
                beginAtZero: true
              }
            }
          },
        };

        const ctx3 = document.getElementById('chart3').getContext('2d');
        new Chart(ctx3, config3);
      }
    });

  </script>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <div class="row text-center">
    <div class="col-md-4">
      <!-- 첫 번째 차트 아이콘 -->
      <button class="btn-lg" type="button" data-bs-toggle="modal" data-bs-target="#modal1">
        <img src="/static/images/free-icon-line-chart.png" class="btn-img"></img>
        <p class="btn-font">CCTV, 가로등 & 범죄발생건수</p>
      </button>
    </div>
    <div class="col-md-4">
        <!-- 두 번째 차트 아이콘 -->
        <button class="btn-lg" type="button" data-bs-toggle="modal" data-bs-target="#modal2">
          <img src="/static/images/free-icon-pie-chart.png" class="btn-img"></img>
          <p class="btn-font">어린이 보호구역 교통사고 발생 비율</p>
        </button>
      </a>
    </div>
    <div class="col-md-4">
        <!-- 세 번째 차트 아이콘 -->
        <button class="btn-lg" type="button" data-bs-toggle="modal" data-bs-target="#modal3">
          <img src="/static/images/free-icon-gantt-chart.png" class="btn-img"></img>
          <p class="btn-font">연도별 평균 매매가</p>
        </button>
      </a>
    </div>
  </div>

  <!-- Modal1 -->
  <div class="modal fade" id="modal1" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">CCTV, 가로등 & 범죄발생건수</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <canvas id="chart1"></canvas>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal2 -->
  <div class="modal fade" id="modal2" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="exampleModalLabel">어린이 보호구역 교통사고 발생 비율</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <canvas id="chart2"></canvas>
        </div>
        <div class="modal-footer">
          <span>* 일반 교통사고 발생 비율 대비</span>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal3 -->
  <div class="modal fade" id="modal3" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">연도별 평균 매매가</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <canvas id="chart3"></canvas>
        </div>
        <div class="modal-footer d-flex justify-content-between">
          <p class="text-start">단위: 만 원</p>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
